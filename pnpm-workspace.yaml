allowBuilds:
  esbuild: true
  sharp: false
  skia-canvas: set this to true or false
  supabase: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@next/env@16.4.3"
  - "@next/swc-darwin-arm64@16.4.3"
  - "@next/swc-darwin-x64@16.4.3"
  - "@next/swc-linux-arm64-gnu@16.4.3"
  - "@next/swc-linux-arm64-musl@16.4.3"
  - "@next/swc-linux-x64-gnu@16.4.3"
  - "@next/swc-linux-x64-musl@16.4.3"
  - "@next/swc-win32-arm64-msvc@16.4.3"
  - "@next/swc-win32-x64-msvc@16.4.3"
  - next@16.4.3
  - "@next/bundle-analyzer@16.4.3"
  - "@next/eslint-plugin-next@16.4.3"
  - eslint-config-next@16.4.3

# Pin the resolved version on every `pnpm add` (docs/02-tech-stack.md).
saveExact: true
# Run package scripts with a cross-platform shell so `VAR=x cmd` works on Windows too.
shellEmulator: true
