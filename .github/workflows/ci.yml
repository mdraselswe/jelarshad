# Installed in Phase 0.3 as .github/workflows/ci.yml
# Runs on every PR, and is called by deploy.yml on every push to main. All checks must pass before merge (branch protection).
name: CI
on:
  pull_request:
  workflow_call: # deploy.yml runs this same CI before deploying to production
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
      # CI tests the real app; the pre-launch gate itself is unit-tested (src/lib/launch-gate.test.ts).
      NEXT_PUBLIC_LAUNCHED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:themes
      - run: pnpm build
        env:
          # CI build uses a mock data layer so it never touches real projects (see docs/03-architecture.md)
          DB_PROVIDER: mock
          NEXT_PUBLIC_STORAGE_PROVIDER: mock
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { DB_PROVIDER: mock, NEXT_PUBLIC_STORAGE_PROVIDER: mock }
      - name: Lighthouse budgets
        run: pnpm dlx @lhci/cli@0.15.x autorun
        env: { DB_PROVIDER: mock, NEXT_PUBLIC_STORAGE_PROVIDER: mock }
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  # Repository adapters and SQL against a throwaway local Supabase (Docker on the runner). Never
  # touches DEV/PROD: migrations, pgTAP, generated types and the Supabase repository contract.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: supabase/setup-cli@v3
        with: { version: 2.119.0 } # same CLI as package.json
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (applies supabase/migrations)
        run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor
      - name: Database tests (pgTAP)
        run: supabase test db
      - name: Generated DB types are up to date
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.raw.ts
          pnpm exec prettier --stdin-filepath src/infrastructure/supabase/database.types.ts \
            < /tmp/database.types.raw.ts > /tmp/database.types.ts
          diff -u src/infrastructure/supabase/database.types.ts /tmp/database.types.ts \
            || { echo "::error::Run the CI 'database' job and commit the database-types artifact"; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: database-types, path: /tmp/database.types.ts, retention-days: 7 }
      - name: Load fixtures (replaces the curated seed; this database is throwaway)
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q \
            -c "truncate districts, areas, foods, aliases, regional_fame, places, dishes cascade"
          pnpm exec tsx scripts/fixtures-sql.ts | psql "$DB_URL" -v ON_ERROR_STOP=1 -q
      - name: Supabase repository contract
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          SUPABASE_TEST_URL="$API_URL" SUPABASE_TEST_ANON_KEY="$ANON_KEY" SUPABASE_TEST_SERVICE_KEY="$SERVICE_ROLE_KEY" \
            pnpm exec vitest run src/infrastructure/supabase
