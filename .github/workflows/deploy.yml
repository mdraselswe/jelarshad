# Installed in Phase 0.3 as .github/workflows/deploy.yml
# Push to main: run the full CI, migrate PROD database, deploy to the production URL, smoke test.
name: Deploy production
on:
  push:
    branches: [main]
concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a running production deploy
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      { name: production, url: "${{ vars.PRODUCTION_URL || 'https://shojashapta.com' }}" }
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.119.0 } # same CLI as package.json, so config.toml parses
      - name: Migrate PROD database (backward-compatible migrations only)
        # No migrations exist before Phase 1; skip instead of linking an unused project.
        if: hashFiles('supabase/migrations/*.sql') != ''
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}" -p "${{ secrets.SUPABASE_PROD_DB_PASSWORD }}"
          supabase db push -p "${{ secrets.SUPABASE_PROD_DB_PASSWORD }}"
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Check pulled environment (shapes only, no secrets)
        run: |
          f=.vercel/.env.production.local
          for k in AUTH_PROVIDER DB_PROVIDER NEXT_PUBLIC_STORAGE_PROVIDER; do
            echo "$k=$(grep "^$k=" $f | cut -d= -f2-)"
          done
          for k in ADMIN_EMAILS SUPABASE_SERVICE_ROLE_KEY CLOUDINARY_API_SECRET NEXT_PUBLIC_SUPABASE_URL; do
            v=$(grep "^$k=" $f | cut -d= -f2-)
            echo "$k: length=${#v} startsWithQuote=$([ "${v:0:1}" = '"' ] && echo yes || echo no) hasAt=$(echo "$v" | grep -c @)"
          done
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Smoke test
        env:
          # Set the repository variable PRODUCTION_URL to the live address (default: the first domain).
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://shojashapta.com' }}
        run: |
          # A new production deployment takes a short while to start serving; retry for up to ~2 min.
          # A 200 alone could come from anyone (a registrar parking page answers 200 for every path):
          # /api/health must be ours and must report the commit we just deployed.
          ok=false
          for attempt in $(seq 1 12); do
            health=$(curl -s --max-time 15 "$BASE_URL/api/health" || true)
            echo "attempt $attempt: /api/health -> $health"
            if echo "$health" | grep -q '"ok":true' && echo "$health" | grep -q "\"version\":\"$GITHUB_SHA\""; then
              ok=true; break
            fi
            sleep 10
          done
          $ok || { echo "::error::production is not serving $GITHUB_SHA"; exit 1; }
          for path in / /food/doi; do
            code=$(curl -sL -o /dev/null --max-time 15 -w "%{http_code}" "$BASE_URL$path")
            echo "$path -> $code"; [ "$code" = "200" ] || exit 1
          done
