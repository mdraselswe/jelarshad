# Installed in Phase 0.3 as .github/workflows/preview.yml
# Every PR: apply migrations to the DEV database, deploy a Vercel preview, print the URL.
name: Preview
on:
  pull_request:
concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: supabase/setup-cli@v3
        with: { version: 2.119.0 } # same CLI as package.json, so config.toml parses
      - name: Migrate DEV database
        # No migrations exist before Phase 1; skip instead of linking an unused project.
        if: hashFiles('supabase/migrations/*.sql') != ''
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_DEV_PROJECT_REF }}" -p "${{ secrets.SUPABASE_DEV_DB_PASSWORD }}"
          supabase db push -p "${{ secrets.SUPABASE_DEV_DB_PASSWORD }}"
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
      - name: Database tests on DEV (RLS, privileges, functions — rolled back)
        if: hashFiles('supabase/tests/*.sql') != ''
        run: supabase test db --linked
        env:
          SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DEV_DB_PASSWORD }}"
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - run: echo "### Preview ready → ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
